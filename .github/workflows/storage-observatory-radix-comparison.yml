name: Storage Observatory Radix Scanner Comparison
on:
  push:
    branches: [storage-observatory-ci-temp]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Materialize Storage Observatory benchmark
        shell: bash
        run: |
          set -euo pipefail
          cat storage-observatory-benchmark-v2/chunk-*.b64 > /tmp/benchmark.b64
          echo "b1cae07159f938fc6821ca583cdaeddb7d6fde836f4c359689783b2a91e7812d  /tmp/benchmark.b64" | shasum -a 256 -c -
          base64 -D -i /tmp/benchmark.b64 -o /tmp/benchmark.tar.gz
          echo "1079e788633dd41034f544aa78fc9faceee45f087f96f9f9faf1aa78871077d9  /tmp/benchmark.tar.gz" | shasum -a 256 -c -
          mkdir benchmark
          tar -xzf /tmp/benchmark.tar.gz -C benchmark
          cd benchmark
          echo "6c4c9c7ca728fafb18f2824813529e815a6c30a9085335cce3464d5b7639bb93  ../storage-observatory-benchmark-v2/root-support.patch" | shasum -a 256 -c -
          patch -p1 < ../storage-observatory-benchmark-v2/root-support.patch
      - name: Toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
      - name: Build Storage Observatory benchmark
        working-directory: benchmark
        run: swift build -c release --product StorageBenchmark
      - name: Checkout frozen Radix
        shell: bash
        run: |
          set -euo pipefail
          mkdir radix && cd radix
          git init
          git remote add origin https://github.com/colinvkim/Radix.git
          git fetch --depth=1 origin 8dff58f32cdcfd1cef4a6faa74656fa6bc891279
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "8dff58f32cdcfd1cef4a6faa74656fa6bc891279"
      - name: Create shared 100K fixture
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE="$RUNNER_TEMP/storage-observatory-shared-100k"
          mkdir -p "$FIXTURE"
          python3 - "$FIXTURE" <<'PY'
          import os, sys
          root=sys.argv[1]
          payload=b'SO'
          for d in range(100):
              p=os.path.join(root, f'd{d:05d}')
              os.mkdir(p)
              for f in range(1000):
                  with open(os.path.join(p, f'f{f:05d}.dat'), 'wb') as h:
                      h.write(payload)
          print(root)
          PY
          echo "FIXTURE=$FIXTURE" >> "$GITHUB_ENV"
          test "$(find "$FIXTURE" -type f | wc -l | tr -d ' ')" = "100000"
      - name: Radix pass 1
        working-directory: radix
        shell: bash
        run: |
          set -o pipefail
          RADIX_BENCH=1 RADIX_BENCH_PATH="$FIXTURE" RADIX_BENCH_AUTO_SUMMARIZE=0 swift test -c release --filter ScanBenchmarkTests/testRealWorldScanBenchmark 2>&1 | tee ../radix-pass1.log
          grep 'RADIX_BENCH_RESULT' ../radix-pass1.log
      - name: Storage Observatory Foundation
        working-directory: benchmark
        run: .build/release/StorageBenchmark --files 100000 --repeats 2 --backend foundation --root "$FIXTURE" > ../storage-observatory-foundation.json
      - name: Storage Observatory Bulk
        working-directory: benchmark
        run: .build/release/StorageBenchmark --files 100000 --repeats 2 --backend adaptive --root "$FIXTURE" > ../storage-observatory-bulk.json
      - name: Radix pass 2
        working-directory: radix
        shell: bash
        run: |
          set -o pipefail
          RADIX_BENCH=1 RADIX_BENCH_PATH="$FIXTURE" RADIX_BENCH_AUTO_SUMMARIZE=0 swift test -c release --filter ScanBenchmarkTests/testRealWorldScanBenchmark 2>&1 | tee ../radix-pass2.log
          grep 'RADIX_BENCH_RESULT' ../radix-pass2.log
      - name: Summary
        run: |
          python3 - <<'PY'
          import json
          for p in ['storage-observatory-foundation.json','storage-observatory-bulk.json']:
              d=json.load(open(p)); print(p, d['medianElapsedSeconds'], d['medianNodesPerSecond'], d['samples'][0]['backend'])
          PY
          grep -A15 'RADIX_BENCH_RESULT' radix-pass1.log || true
          grep -A15 'RADIX_BENCH_RESULT' radix-pass2.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: StorageObservatory-Radix-shared-100K
          path: |
            storage-observatory-foundation.json
            storage-observatory-bulk.json
            radix-pass1.log
            radix-pass2.log
          if-no-files-found: error
