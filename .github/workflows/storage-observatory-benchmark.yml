name: Storage Observatory Scanner Benchmark
on:
  push:
    branches: [storage-observatory-ci-temp]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standard:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            files: 100000
          - runner: macos-15
            arch: arm64
            files: 500000
          - runner: macos-15-intel
            arch: x86_64
            files: 100000
          - runner: macos-15-intel
            arch: x86_64
            files: 500000
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Materialize exact benchmark package
        shell: bash
        run: |
          set -euo pipefail
          cat storage-observatory-benchmark-v2/chunk-*.b64 > /tmp/benchmark.b64
          echo "b1cae07159f938fc6821ca583cdaeddb7d6fde836f4c359689783b2a91e7812d  /tmp/benchmark.b64" | shasum -a 256 -c -
          base64 -D -i /tmp/benchmark.b64 -o /tmp/benchmark.tar.gz
          echo "1079e788633dd41034f544aa78fc9faceee45f087f96f9f9faf1aa78871077d9  /tmp/benchmark.tar.gz" | shasum -a 256 -c -
          mkdir benchmark
          tar -xzf /tmp/benchmark.tar.gz -C benchmark
      - name: Toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
      - name: Build benchmark
        working-directory: benchmark
        run: swift build -c release --product StorageBenchmark
      - name: Foundation benchmark
        working-directory: benchmark
        run: .build/release/StorageBenchmark --files ${{ matrix.files }} --repeats 2 --backend foundation > foundation-${{ matrix.files }}-${{ matrix.arch }}.json
      - name: Adaptive benchmark
        working-directory: benchmark
        run: .build/release/StorageBenchmark --files ${{ matrix.files }} --repeats 2 --backend adaptive > adaptive-${{ matrix.files }}-${{ matrix.arch }}.json
      - name: Summarize
        working-directory: benchmark
        run: |
          python3 - <<'PY'
          import json, glob
          for path in sorted(glob.glob('*.json')):
              d=json.load(open(path))
              print(path, 'backend=', d['samples'][0]['backend'], 'median_s=', round(d['medianElapsedSeconds'],4), 'nodes_s=', round(d['medianNodesPerSecond']), 'peak_rss=', max(s['peakRSSBytes'] for s in d['samples']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: StorageObservatory-benchmark-${{ matrix.arch }}-${{ matrix.files }}
          path: benchmark/*.json
          if-no-files-found: error
