name: GLaDOS V3 macOS RC Build

on:
  workflow_dispatch:
  push:
    branches: [v3/account-center]
    paths:
      - '.github/glados/macos-rc4-ci.part*'
      - '.github/glados/macos-rc5-overlay.part*'
      - '.github/workflows/v3MacRCBuild.yml'
  pull_request:
    branches: [master]
    paths:
      - '.github/glados/macos-rc4-ci.part*'
      - '.github/glados/macos-rc5-overlay.part*'
      - '.github/workflows/v3MacRCBuild.yml'

permissions:
  contents: read

jobs:
  xcode-build:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Restore exact RC5 source bundle
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/gac-rc5"
          mkdir -p "$work"

          cat .github/glados/macos-rc4-ci.part00 \
              .github/glados/macos-rc4-ci.part01 \
              .github/glados/macos-rc4-ci.part02 \
              .github/glados/macos-rc4-ci.part03 \
              .github/glados/macos-rc4-ci.part04 \
              .github/glados/macos-rc4-ci.part05 > "$RUNNER_TEMP/gac-rc4.b64"
          python3 - <<'PY'
          import base64, hashlib, os, pathlib
          tmp = pathlib.Path(os.environ['RUNNER_TEMP'])
          raw = base64.b64decode((tmp / 'gac-rc4.b64').read_text().strip(), validate=True)
          expected = 'c9961868e0c16f821f1bd465491d996af1d48d4ddf77fe648fa19d24cecb1e55'
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f'RC4 base checksum mismatch: {actual}')
          (tmp / 'gac-rc4.tar.xz').write_bytes(raw)
          print('RC4_SOURCE_SHA256=' + actual)
          PY
          tar -xJf "$RUNNER_TEMP/gac-rc4.tar.xz" -C "$work"

          cat .github/glados/macos-rc5-overlay.part00 \
              .github/glados/macos-rc5-overlay.part01 \
              .github/glados/macos-rc5-overlay.part02 \
              .github/glados/macos-rc5-overlay.part03 \
              .github/glados/macos-rc5-overlay.part04 \
              .github/glados/macos-rc5-overlay.part05 > "$RUNNER_TEMP/gac-rc5-overlay.b64"
          python3 - <<'PY'
          import base64, hashlib, os, pathlib
          tmp = pathlib.Path(os.environ['RUNNER_TEMP'])
          raw = base64.b64decode((tmp / 'gac-rc5-overlay.b64').read_text().strip(), validate=True)
          expected = 'bee8ea2d48b822e7e180c303b0715ff15e2af7c543c4742042871546986ff90c'
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f'RC5 overlay checksum mismatch: {actual}')
          (tmp / 'gac-rc5-overlay.tar.xz').write_bytes(raw)
          print('RC5_OVERLAY_SHA256=' + actual)
          PY
          tar -xJf "$RUNNER_TEMP/gac-rc5-overlay.tar.xz" -C "$work"
          if [[ -f "$work/.rc5-delete-list" ]]; then
            while IFS= read -r rel; do
              [[ -z "$rel" ]] && continue
              rm -f "$work/$rel"
            done < "$work/.rc5-delete-list"
            rm -f "$work/.rc5-delete-list"
          fi

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          root = Path(os.environ['RUNNER_TEMP']) / 'gac-rc5'
          manifest = json.loads((root / 'RELEASE-CANDIDATE-MANIFEST.json').read_text())
          if manifest.get('candidate') != 5:
              raise SystemExit(f"expected RC5 manifest, got {manifest.get('candidate')!r}")
          roots = ['App','AppTests','Models','NativeHost','SafariExtension','Services','Shared','Views']
          files = []
          for d in roots:
              files += list((root / d).rglob('*.swift'))
          files += [root/'project.yml', root/'Info.plist', root/'SafariExtension/Info.plist']
          files = sorted(set(files), key=lambda p: p.relative_to(root).as_posix())
          h = hashlib.sha256()
          for p in files:
              rel = p.relative_to(root).as_posix().encode()
              h.update(rel); h.update(b'\0'); h.update(p.read_bytes()); h.update(b'\0')
          actual = h.hexdigest()
          expected = 'aa320f890a9307420e0108e24446322e6c7ce1411e62f9ecead92b2a365c6bf9'
          print(f'RC5_XCODE_INPUT_AGGREGATE={actual} FILES={len(files)}')
          if len(files) != 23 or actual != expected:
              raise SystemExit('RC5 Xcode input closure differs from final RC5 package')
          PY

          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$work/Info.plist" | grep -Fx '30005'
          grep -F 'getStateOfExtension' "$work/Services/SafariExtensionService.swift"
          grep -F '@Sendable state, error in' "$work/Services/SafariExtensionService.swift"
          grep -F 'testSafariExtensionStatusCallbackIsExecutorSafe' "$work/AppTests/ModelTests.swift"
          ! grep -F 'Dictionary(uniqueKeysWithValues:' "$work/Services/LocalStore.swift"

      - name: Validate changed macOS command scripts
        working-directory: ${{ runner.temp }}/gac-rc5
        shell: bash
        run: |
          set -euo pipefail
          for f in '清理旧版本.command' '构建并安装.command' '明日最终验收.command'; do
            test -f "$f"
            echo "zsh -n: $f"
            zsh -n "$f"
          done
          grep -F '/Volumes/*/UserData/Downloads' '清理旧版本.command'
          grep -F 'DerivedData' '清理旧版本.command'
          grep -F 'lsregister' '清理旧版本.command'

      - name: Install XcodeGen
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        working-directory: ${{ runner.temp }}/gac-rc5
        run: xcodegen generate --spec project.yml

      - name: XCTest exactly as installer
        working-directory: ${{ runner.temp }}/gac-rc5
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/xcodebuild-tests.log"
          if ! xcodebuild \
            -project GLaDOSAccountCenter.xcodeproj \
            -scheme GLaDOSAccountCenter \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedDataTests" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGNING_ALLOWED=YES \
            test >"$log" 2>&1; then
            echo '--- XCTest failure (last 300 lines) ---'
            tail -n 300 "$log"
            find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f -name 'GLaDOS Account Center*' -mmin -5 -print -exec tail -n 160 {} \; 2>/dev/null || true
            exit 1
          fi
          grep -E 'Test Suite .* passed|Executed [0-9]+ tests|TEST SUCCEEDED' "$log" | tail -n 40 || true
          tail -n 60 "$log"

      - name: Release build exactly as installer
        working-directory: ${{ runner.temp }}/gac-rc5
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/xcodebuild-release.log"
          if ! xcodebuild \
            -project GLaDOSAccountCenter.xcodeproj \
            -scheme GLaDOSAccountCenter \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedDataRelease" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGNING_ALLOWED=YES \
            build >"$log" 2>&1; then
            echo '--- Release failure (last 300 lines) ---'
            tail -n 300 "$log"
            exit 1
          fi
          app="$RUNNER_TEMP/DerivedDataRelease/Build/Products/Release/GLaDOS Account Center.app"
          test -d "$app"
          test -d "$app/Contents/PlugIns/GLaDOS Account Center Safari Extension.appex"
          codesign --verify --deep --strict "$app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist" | grep -Fx 'com.enoch.glados-account-center'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist" | grep -Fx '30005'
          tail -n 50 "$log"

      - name: Release startup smoke for diagnosed SafariServices crash
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/DerivedDataRelease/Build/Products/Release/GLaDOS Account Center.app"
          exe="$app/Contents/MacOS/GLaDOS Account Center"
          smoke="$RUNNER_TEMP/rc5-startup-smoke.log"
          before="$RUNNER_TEMP/crashes-before.txt"
          after="$RUNNER_TEMP/crashes-after.txt"
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f -name 'GLaDOS Account Center*' -print 2>/dev/null | sort > "$before" || true
          "$exe" >"$smoke" 2>&1 &
          pid=$!
          sleep 15
          if ! kill -0 "$pid" 2>/dev/null; then
            echo 'RC5 exited/crashed during 15-second startup smoke:'
            cat "$smoke" || true
            find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f -name 'GLaDOS Account Center*' -mmin -5 -print -exec tail -n 180 {} \; 2>/dev/null || true
            exit 1
          fi
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f -name 'GLaDOS Account Center*' -print 2>/dev/null | sort > "$after" || true
          if comm -13 "$before" "$after" | grep -q .; then
            echo 'A new GLaDOS crash report appeared during smoke test:'
            comm -13 "$before" "$after"
            exit 1
          fi
          echo 'RC5_STARTUP_SMOKE_OK'
