name: GLaDOS V3 macOS RC Build

on:
  workflow_dispatch:
  push:
    branches: [v3/account-center]
    paths:
      - '.github/glados/macos-rc4-ci.part*'
      - '.github/glados/macos-rc5-exact.part*'
      - '.github/glados/macos-rc5-final-hashes.txt'
      - '.github/workflows/v3MacRCBuild.yml'
  pull_request:
    branches: [master]
    paths:
      - '.github/glados/macos-rc4-ci.part*'
      - '.github/glados/macos-rc5-exact.part*'
      - '.github/glados/macos-rc5-final-hashes.txt'
      - '.github/workflows/v3MacRCBuild.yml'

permissions:
  contents: read

jobs:
  xcode-build:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Restore and compare exact RC5 Xcode input
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/gac-rc5"; mkdir -p "$work"
          cat .github/glados/macos-rc4-ci.part00 .github/glados/macos-rc4-ci.part01 .github/glados/macos-rc4-ci.part02 .github/glados/macos-rc4-ci.part03 .github/glados/macos-rc4-ci.part04 .github/glados/macos-rc4-ci.part05 > "$RUNNER_TEMP/base.b64"
          python3 - <<'PY'
          import base64,hashlib,os,pathlib
          t=pathlib.Path(os.environ['RUNNER_TEMP']); raw=base64.b64decode((t/'base.b64').read_text().strip(),validate=True)
          if hashlib.sha256(raw).hexdigest()!='c9961868e0c16f821f1bd465491d996af1d48d4ddf77fe648fa19d24cecb1e55': raise SystemExit('RC4 base checksum mismatch')
          (t/'base.tar.xz').write_bytes(raw)
          PY
          tar -xJf "$RUNNER_TEMP/base.tar.xz" -C "$work"
          cat .github/glados/macos-rc5-exact.part00 .github/glados/macos-rc5-exact.part01 .github/glados/macos-rc5-exact.part02 .github/glados/macos-rc5-exact.part03 .github/glados/macos-rc5-exact.part04 .github/glados/macos-rc5-exact.part05 > "$RUNNER_TEMP/rc5.b64"
          python3 - <<'PY'
          import base64,hashlib,os,pathlib
          t=pathlib.Path(os.environ['RUNNER_TEMP']); raw=base64.b64decode((t/'rc5.b64').read_text().strip(),validate=True)
          actual=hashlib.sha256(raw).hexdigest(); print('RC5_PREBRIDGE_TAR_SHA256='+actual)
          if actual!='d23f5a1e086081bd3101c666eb517333902d0148ecf741e7837627840efb6584': raise SystemExit('RC5 input checksum mismatch')
          (t/'rc5.tar.xz').write_bytes(raw)
          PY
          tar -xJf "$RUNNER_TEMP/rc5.tar.xz" -C "$work"

          cat > "$work/Services/SafariExtensionBridge.h" <<'EOF'
          #import <Foundation/Foundation.h>

          NS_ASSUME_NONNULL_BEGIN

          typedef void (^GACSafariStatusCompletion)(BOOL enabled, NSString *detail);
          typedef void (^GACSafariMessageCompletion)(NSString *detail);

          FOUNDATION_EXPORT void GACGetSafariExtensionStatus(NSString *identifier, GACSafariStatusCompletion completion);
          FOUNDATION_EXPORT void GACOpenSafariExtensionPreferences(NSString *identifier, GACSafariMessageCompletion completion);

          NS_ASSUME_NONNULL_END
          EOF
          cat > "$work/Services/SafariExtensionBridge.m" <<'EOF'
          #import "SafariExtensionBridge.h"
          @import SafariServices;

          static void GACDispatchMain(dispatch_block_t block) {
              if ([NSThread isMainThread]) {
                  block();
              } else {
                  dispatch_async(dispatch_get_main_queue(), block);
              }
          }

          void GACGetSafariExtensionStatus(NSString *identifier, GACSafariStatusCompletion completion) {
              [SFSafariExtensionManager getStateOfSafariExtensionWithIdentifier:identifier
                                                             completionHandler:^(SFSafariExtensionState *state, NSError *error) {
                  BOOL enabled = (error == nil && state != nil && state.enabled);
                  NSString *detail = error != nil
                      ? error.localizedDescription
                      : (state == nil ? @"系统未返回 Safari 扩展状态" : (state.enabled ? @"已启用" : @"未启用"));
                  GACDispatchMain(^{ completion(enabled, detail); });
              }];
          }

          void GACOpenSafariExtensionPreferences(NSString *identifier, GACSafariMessageCompletion completion) {
              [SFSafariApplication showPreferencesForExtensionWithIdentifier:identifier
                                                           completionHandler:^(NSError *error) {
                  NSString *detail = error != nil
                      ? [NSString stringWithFormat:@"无法打开 Safari 扩展设置：%@", error.localizedDescription]
                      : @"已打开 Safari 扩展设置。";
                  GACDispatchMain(^{ completion(detail); });
              }];
          }
          EOF
          cat > "$work/Services/SafariExtensionService.swift" <<'EOF'
          import Foundation

          /// SafariServices calls back on a private NSXPC queue. Swift 6 can attach an
          /// executor precondition to a Swift closure before its body begins, so merely
          /// marking that closure `@Sendable` is insufficient. The Objective-C bridge
          /// receives Safari's reply first and dispatches to the main queue before any
          /// Swift closure is invoked.
          @MainActor
          enum SafariExtensionService {
              static let bundleIdentifier = "com.enoch.glados-account-center.safari-extension"

              static func openPreferencesAsync() async -> String {
                  await withCheckedContinuation { continuation in
                      GACOpenSafariExtensionPreferences(bundleIdentifier) { detail in
                          continuation.resume(returning: detail)
                      }
                  }
              }

              static func statusAsync() async -> (Bool, String) {
                  await withCheckedContinuation { continuation in
                      GACGetSafariExtensionStatus(bundleIdentifier) { enabled, detail in
                          continuation.resume(returning: (enabled, detail))
                      }
                  }
              }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,os
          root=Path(os.environ['RUNNER_TEMP'])/'gac-rc5'
          p=root/'project.yml'; s=p.read_text()
          if 'SWIFT_OBJC_BRIDGING_HEADER' not in s:
              needle='        ASSETCATALOG_COMPILER_APPICON_NAME: ""\n'; s=s.replace(needle,needle+'        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Services/SafariExtensionBridge.h"\n',1)
          app_old='''        ASSETCATALOG_COMPILER_APPICON_NAME: ""\n        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Services/SafariExtensionBridge.h"\n'''
          app_new='''        ASSETCATALOG_COMPILER_APPICON_NAME: ""\n        CURRENT_PROJECT_VERSION: 30005\n        MARKETING_VERSION: 3.0.0\n        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Services/SafariExtensionBridge.h"\n'''
          if app_old not in s: raise SystemExit('app target insertion point missing')
          s=s.replace(app_old,app_new,1)
          ext_old='''        APPLICATION_EXTENSION_API_ONLY: YES\n'''; ext_new='''        APPLICATION_EXTENSION_API_ONLY: YES\n        CURRENT_PROJECT_VERSION: 30005\n        MARKETING_VERSION: 3.0.0\n'''
          if ext_old not in s: raise SystemExit('extension target insertion point missing')
          p.write_text(s.replace(ext_old,ext_new,1))
          t=root/'AppTests/ModelTests.swift'; ts=t.read_text(); old='    func testSafariExtensionStatusCallbackIsExecutorSafe() async {'; new='    @MainActor\n    func testSafariExtensionObjectiveCBridgeIsExecutorSafe() async {'
          if old not in ts: raise SystemExit('test normalization point missing')
          t.write_text(ts.replace(old,new,1))

          expected={}
          for line in Path('.github/glados/macos-rc5-final-hashes.txt').read_text().splitlines():
              if line.strip():
                  digest,path=line.split(' ',1); expected[path]=digest
          roots=['App','AppTests','Models','NativeHost','SafariExtension','Services','Shared','Views']; files=[]
          for d in roots:
              for ext in ('*.swift','*.h','*.m'): files += list((root/d).rglob(ext))
          files += [root/'project.yml',root/'Info.plist',root/'SafariExtension/Info.plist']
          files=sorted(set(files),key=lambda f:f.relative_to(root).as_posix())
          bad=[]
          for f in files:
              rel=f.relative_to(root).as_posix(); actual=hashlib.sha256(f.read_bytes()).hexdigest(); want=expected.get(rel)
              print(actual,rel)
              if actual!=want: bad.append((rel,want,actual))
          if len(files)!=25 or len(expected)!=25: bad.append(('COUNT','25',f'files={len(files)} expected={len(expected)}'))
          if bad:
              print('--- RC5 BYTE MISMATCHES ---')
              for rel,want,actual in bad: print(rel,'expected=',want,'actual=',actual)
              raise SystemExit('RC5 Xcode inputs do not byte-match final local package')
          print('RC5_XCODE_INPUTS_BYTE_MATCH_OK')
          PY

      - name: Validate changed macOS command scripts
        working-directory: ${{ runner.temp }}/gac-rc5
        run: |
          for f in '清理旧版本.command' '构建并安装.command' '明日最终验收.command'; do zsh -n "$f"; done

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate project
        working-directory: ${{ runner.temp }}/gac-rc5
        run: xcodegen generate --spec project.yml

      - name: XCTest
        working-directory: ${{ runner.temp }}/gac-rc5
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/tests.log"
          if ! xcodebuild -project GLaDOSAccountCenter.xcodeproj -scheme GLaDOSAccountCenter -configuration Debug -derivedDataPath "$RUNNER_TEMP/DerivedDataTests" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGNING_ALLOWED=YES CURRENT_PROJECT_VERSION=30005 MARKETING_VERSION=3.0.0 test >"$log" 2>&1; then tail -n 360 "$log"; exit 1; fi
          grep -E 'Executed [0-9]+ tests|TEST SUCCEEDED' "$log" | tail -n 20 || true

      - name: Release build and metadata
        working-directory: ${{ runner.temp }}/gac-rc5
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/release.log"
          if ! xcodebuild -project GLaDOSAccountCenter.xcodeproj -scheme GLaDOSAccountCenter -configuration Release -derivedDataPath "$RUNNER_TEMP/DerivedDataRelease" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGNING_ALLOWED=YES CURRENT_PROJECT_VERSION=30005 MARKETING_VERSION=3.0.0 build >"$log" 2>&1; then tail -n 360 "$log"; exit 1; fi
          app="$RUNNER_TEMP/DerivedDataRelease/Build/Products/Release/GLaDOS Account Center.app"
          codesign --verify --deep --strict "$app"
          bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")
          short=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          echo "BUNDLE=$bundle VERSION=$version SHORT=$short"
          if [[ "$bundle" != 'com.enoch.glados-account-center' || "$version" != '30005' || "$short" != '3.0.0' ]]; then exit 1; fi
          test -d "$app/Contents/PlugIns/GLaDOS Account Center Safari Extension.appex"
          echo RC5_RELEASE_BUILD_OK

      - name: Startup smoke
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/DerivedDataRelease/Build/Products/Release/GLaDOS Account Center.app"; exe="$app/Contents/MacOS/GLaDOS Account Center"
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f -name 'GLaDOS Account Center*' -print 2>/dev/null | sort > "$RUNNER_TEMP/before" || true
          "$exe" >"$RUNNER_TEMP/smoke.log" 2>&1 & pid=$!; sleep 15
          kill -0 "$pid" 2>/dev/null || { cat "$RUNNER_TEMP/smoke.log" || true; exit 1; }
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f -name 'GLaDOS Account Center*' -print 2>/dev/null | sort > "$RUNNER_TEMP/after" || true
          [[ -z "$(comm -13 "$RUNNER_TEMP/before" "$RUNNER_TEMP/after" || true)" ]] || exit 1
          /usr/bin/osascript -e 'tell application id "com.enoch.glados-account-center" to quit' >/dev/null 2>&1 || kill "$pid" 2>/dev/null || true
          sleep 1; kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true
          echo RC5_STARTUP_SMOKE_OK
