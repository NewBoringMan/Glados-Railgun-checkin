name: GLaDOS V3 macOS RC Build

on:
  workflow_dispatch:
  push:
    branches: [v3/account-center]
    paths:
      - '.github/glados/macos-rc4-ci.part*'
      - '.github/glados/macos-rc5.patch.part*'
      - '.github/workflows/v3MacRCBuild.yml'
  pull_request:
    branches: [master]
    paths:
      - '.github/glados/macos-rc4-ci.part*'
      - '.github/glados/macos-rc5.patch.part*'
      - '.github/workflows/v3MacRCBuild.yml'

permissions:
  contents: read

jobs:
  xcode-build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Restore CI base and materialize exact RC5 Xcode inputs
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/gac-rc5"
          mkdir -p "$work"

          cat .github/glados/macos-rc4-ci.part00 \
              .github/glados/macos-rc4-ci.part01 \
              .github/glados/macos-rc4-ci.part02 \
              .github/glados/macos-rc4-ci.part03 \
              .github/glados/macos-rc4-ci.part04 \
              .github/glados/macos-rc4-ci.part05 > "$RUNNER_TEMP/gac-rc4.b64"
          python3 - <<'PY'
          import base64, hashlib, os, pathlib
          tmp=pathlib.Path(os.environ['RUNNER_TEMP'])
          raw=base64.b64decode((tmp/'gac-rc4.b64').read_text().strip(), validate=True)
          expected='c9961868e0c16f821f1bd465491d996af1d48d4ddf77fe648fa19d24cecb1e55'
          actual=hashlib.sha256(raw).hexdigest()
          if actual != expected: raise SystemExit(f'RC4 base checksum mismatch: {actual}')
          (tmp/'gac-rc4.tar.xz').write_bytes(raw)
          print('RC4_SOURCE_SHA256='+actual)
          PY
          tar -xJf "$RUNNER_TEMP/gac-rc4.tar.xz" -C "$work"

          cat .github/glados/macos-rc5.patch.part00 \
              .github/glados/macos-rc5.patch.part01 \
              .github/glados/macos-rc5.patch.part02 \
              .github/glados/macos-rc5.patch.part03 \
              .github/glados/macos-rc5.patch.part04 > "$RUNNER_TEMP/rc5-patch.b64"
          python3 - <<'PY'
          import base64, gzip, hashlib, os, pathlib
          tmp=pathlib.Path(os.environ['RUNNER_TEMP'])
          raw=base64.b64decode((tmp/'rc5-patch.b64').read_text().strip(), validate=True)
          expected='f6868fe3619833f16d82bb99f2ebe3ae57d5d68ff399478f621d7969e4b4c97c'
          actual=hashlib.sha256(raw).hexdigest()
          if actual != expected: raise SystemExit(f'RC5 patch checksum mismatch: {actual}')
          (tmp/'rc5.patch').write_bytes(gzip.decompress(raw))
          print('RC5_PATCH_GZIP_SHA256='+actual)
          PY

          # The historic RC4 CI fixture predates a few packaging-only files. BSD
          # patch therefore reports those absent documentation/script paths, but
          # continues applying every source-code hunk. We verify the complete
          # Xcode input closure byte-for-byte below, so a failed source hunk can
          # never be hidden by this compatibility handling.
          set +e
          (cd "$work" && patch --batch -p1 < "$RUNNER_TEMP/rc5.patch")
          patch_status=$?
          set -e
          echo "compatibility patch status=$patch_status (packaging-only misses are expected)"

          # The original RC4 CI fixture also predates the final XcodeGen test-host
          # normalization. Materialize exactly the same project/test settings as
          # the RC5 package before the byte-for-byte aggregate gate.
          python3 - <<'PY'
          from pathlib import Path
          import os
          root=Path(os.environ['RUNNER_TEMP'])/'gac-rc5'
          p=root/'project.yml'; s=p.read_text()
          if 'TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GLaDOS Account Center.app/Contents/MacOS/GLaDOS Account Center"' not in s:
              needle='''        PRODUCT_BUNDLE_IDENTIFIER: com.enoch.glados-account-center.tests\n        GENERATE_INFOPLIST_FILE: YES\n        CODE_SIGN_STYLE: Manual\n        CODE_SIGN_IDENTITY: "-"\n'''
              repl=needle+'''        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GLaDOS Account Center.app/Contents/MacOS/GLaDOS Account Center"\n        BUNDLE_LOADER: "$(TEST_HOST)"\n'''
              if needle not in s: raise SystemExit('test target normalization pattern missing')
              p.write_text(s.replace(needle,repl))
          t=root/'AppTests/ModelTests.swift'; ts=t.read_text()
          if '@testable import GLaDOSAccountCenter' in ts:
              t.write_text(ts.replace('@testable import GLaDOSAccountCenter','@testable import GLaDOS_Account_Center'))
          PY

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          root=Path(os.environ['RUNNER_TEMP'])/'gac-rc5'
          files=list(root.rglob('*.swift'))+[root/'project.yml',root/'Info.plist',root/'SafariExtension/Info.plist']
          files=sorted(set(files), key=lambda p:p.relative_to(root).as_posix())
          h=hashlib.sha256()
          for p in files:
              rel=p.relative_to(root).as_posix().encode()
              h.update(rel); h.update(b'\0'); h.update(p.read_bytes()); h.update(b'\0')
          actual=h.hexdigest(); expected='46ca932c0f864e27fc0db6de3a8c2fb4da8dc231ee0f5d49a55909eb44739d3d'
          print(f'RC5_XCODE_INPUT_AGGREGATE={actual} FILES={len(files)}')
          if len(files)!=29 or actual!=expected:
              raise SystemExit('RC5 Xcode input closure differs from the release package')
          PY

          grep -F 'Task { @MainActor in' "$work/Services/SafariExtensionService.swift"
          grep -F 'testSafariExtensionStatusCallbackIsExecutorSafe' "$work/AppTests/ModelTests.swift"
          ! grep -F 'Dictionary(uniqueKeysWithValues:' "$work/Services/LocalStore.swift"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$work/Info.plist" | grep -Fx '30005'

      - name: Install XcodeGen
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        working-directory: ${{ runner.temp }}/gac-rc5
        run: xcodegen generate --spec project.yml

      - name: XCTest including SafariServices crash regression
        working-directory: ${{ runner.temp }}/gac-rc5
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/xcodebuild-tests.log"
          if ! xcodebuild \
            -project GLaDOSAccountCenter.xcodeproj \
            -scheme GLaDOSAccountCenter \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedDataTests" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGNING_ALLOWED=YES \
            test >"$log" 2>&1; then
            echo '--- XCTest failure (last 300 lines) ---'; tail -n 300 "$log"; exit 1
          fi
          grep -E 'Test Suite .* passed|Executed [0-9]+ tests|TEST SUCCEEDED' "$log" | tail -n 30 || true
          tail -n 60 "$log"

      - name: Release build exactly as installer
        working-directory: ${{ runner.temp }}/gac-rc5
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/xcodebuild-release.log"
          if ! xcodebuild \
            -project GLaDOSAccountCenter.xcodeproj \
            -scheme GLaDOSAccountCenter \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedDataRelease" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGNING_ALLOWED=YES \
            build >"$log" 2>&1; then
            echo '--- Release failure (last 300 lines) ---'; tail -n 300 "$log"; exit 1
          fi
          app="$RUNNER_TEMP/DerivedDataRelease/Build/Products/Release/GLaDOS Account Center.app"
          test -d "$app"
          test -d "$app/Contents/PlugIns/GLaDOS Account Center Safari Extension.appex"
          codesign --verify --deep --strict "$app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist" | grep -Fx 'com.enoch.glados-account-center'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist" | grep -Fx '30005'
          tail -n 50 "$log"

      - name: Release startup smoke
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/DerivedDataRelease/Build/Products/Release/GLaDOS Account Center.app"
          exe="$app/Contents/MacOS/GLaDOS Account Center"
          smoke="$RUNNER_TEMP/rc5-startup-smoke.log"
          "$exe" >"$smoke" 2>&1 &
          pid=$!
          sleep 12
          if ! kill -0 "$pid" 2>/dev/null; then
            echo 'RC5 exited/crashed during 12-second startup smoke:'
            cat "$smoke" || true
            find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f -name 'GLaDOS Account Center*' -mmin -5 -print -exec tail -n 120 {} \; 2>/dev/null || true
            exit 1
          fi
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          echo 'RC5_STARTUP_SMOKE_OK'
