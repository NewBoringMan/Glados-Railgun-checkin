name: GLaDOS V3 macOS RC Build

on:
  workflow_dispatch:
  push:
    branches: [v3/account-center]
    paths:
      - '.github/glados/macos-rc4-ci.part*'
      - '.github/glados/macos-rc5-exact.part*'
      - '.github/workflows/v3MacRCBuild.yml'
  pull_request:
    branches: [master]
    paths:
      - '.github/glados/macos-rc4-ci.part*'
      - '.github/glados/macos-rc5-exact.part*'
      - '.github/workflows/v3MacRCBuild.yml'

permissions:
  contents: read

jobs:
  xcode-build:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Restore exact final RC5 Xcode input
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/gac-rc5"
          mkdir -p "$work"
          cat .github/glados/macos-rc4-ci.part00 .github/glados/macos-rc4-ci.part01 .github/glados/macos-rc4-ci.part02 .github/glados/macos-rc4-ci.part03 .github/glados/macos-rc4-ci.part04 .github/glados/macos-rc4-ci.part05 > "$RUNNER_TEMP/gac-rc4.b64"
          python3 - <<'PY'
          import base64, hashlib, os, pathlib
          tmp=pathlib.Path(os.environ['RUNNER_TEMP']); raw=base64.b64decode((tmp/'gac-rc4.b64').read_text().strip(), validate=True)
          actual=hashlib.sha256(raw).hexdigest(); expected='c9961868e0c16f821f1bd465491d996af1d48d4ddf77fe648fa19d24cecb1e55'
          if actual != expected: raise SystemExit('RC4 base checksum mismatch')
          (tmp/'gac-rc4.tar.xz').write_bytes(raw)
          PY
          tar -xJf "$RUNNER_TEMP/gac-rc4.tar.xz" -C "$work"
          cat .github/glados/macos-rc5-exact.part00 .github/glados/macos-rc5-exact.part01 .github/glados/macos-rc5-exact.part02 .github/glados/macos-rc5-exact.part03 .github/glados/macos-rc5-exact.part04 .github/glados/macos-rc5-exact.part05 > "$RUNNER_TEMP/gac-rc5-exact.b64"
          python3 - <<'PY'
          import base64, hashlib, os, pathlib
          tmp=pathlib.Path(os.environ['RUNNER_TEMP']); raw=base64.b64decode((tmp/'gac-rc5-exact.b64').read_text().strip(), validate=True)
          actual=hashlib.sha256(raw).hexdigest(); expected='d23f5a1e086081bd3101c666eb517333902d0148ecf741e7837627840efb6584'
          print('RC5_PREBRIDGE_TAR_SHA256='+actual)
          if actual != expected: raise SystemExit('RC5 exact input checksum mismatch')
          (tmp/'gac-rc5-exact.tar.xz').write_bytes(raw)
          PY
          tar -xJf "$RUNNER_TEMP/gac-rc5-exact.tar.xz" -C "$work"

          cat > "$work/Services/SafariExtensionBridge.h" <<'EOF'
          #import <Foundation/Foundation.h>

          NS_ASSUME_NONNULL_BEGIN

          typedef void (^GACSafariStatusCompletion)(BOOL enabled, NSString *detail);
          typedef void (^GACSafariMessageCompletion)(NSString *detail);

          FOUNDATION_EXPORT void GACGetSafariExtensionStatus(NSString *identifier, GACSafariStatusCompletion completion);
          FOUNDATION_EXPORT void GACOpenSafariExtensionPreferences(NSString *identifier, GACSafariMessageCompletion completion);

          NS_ASSUME_NONNULL_END
          EOF

          cat > "$work/Services/SafariExtensionBridge.m" <<'EOF'
          #import "SafariExtensionBridge.h"
          @import SafariServices;

          static void GACDispatchMain(dispatch_block_t block) {
              if ([NSThread isMainThread]) {
                  block();
              } else {
                  dispatch_async(dispatch_get_main_queue(), block);
              }
          }

          void GACGetSafariExtensionStatus(NSString *identifier, GACSafariStatusCompletion completion) {
              [SFSafariExtensionManager getStateOfSafariExtensionWithIdentifier:identifier
                                                             completionHandler:^(SFSafariExtensionState *state, NSError *error) {
                  BOOL enabled = (error == nil && state != nil && state.enabled);
                  NSString *detail = error != nil
                      ? error.localizedDescription
                      : (state == nil ? @"系统未返回 Safari 扩展状态" : (state.enabled ? @"已启用" : @"未启用"));
                  GACDispatchMain(^{ completion(enabled, detail); });
              }];
          }

          void GACOpenSafariExtensionPreferences(NSString *identifier, GACSafariMessageCompletion completion) {
              [SFSafariApplication showPreferencesForExtensionWithIdentifier:identifier
                                                           completionHandler:^(NSError *error) {
                  NSString *detail = error != nil
                      ? [NSString stringWithFormat:@"无法打开 Safari 扩展设置：%@", error.localizedDescription]
                      : @"已打开 Safari 扩展设置。";
                  GACDispatchMain(^{ completion(detail); });
              }];
          }
          EOF

          cat > "$work/Services/SafariExtensionService.swift" <<'EOF'
          import Foundation

          /// SafariServices calls back on a private NSXPC queue. Swift 6 can attach an
          /// executor precondition to a Swift closure before its body begins, so merely
          /// marking that closure `@Sendable` is insufficient. The Objective-C bridge
          /// receives Safari's reply first and dispatches to the main queue before any
          /// Swift closure is invoked.
          @MainActor
          enum SafariExtensionService {
              static let bundleIdentifier = "com.enoch.glados-account-center.safari-extension"

              static func openPreferencesAsync() async -> String {
                  await withCheckedContinuation { continuation in
                      GACOpenSafariExtensionPreferences(bundleIdentifier) { detail in
                          continuation.resume(returning: detail)
                      }
                  }
              }

              static func statusAsync() async -> (Bool, String) {
                  await withCheckedContinuation { continuation in
                      GACGetSafariExtensionStatus(bundleIdentifier) { enabled, detail in
                          continuation.resume(returning: (enabled, detail))
                      }
                  }
              }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          root=Path(os.environ['RUNNER_TEMP'])/'gac-rc5'
          p=root/'project.yml'; s=p.read_text()
          if 'SWIFT_OBJC_BRIDGING_HEADER' not in s:
              needle='        ASSETCATALOG_COMPILER_APPICON_NAME: ""\n'
              if needle not in s: raise SystemExit('project bridging-header insertion point missing')
              s=s.replace(needle, needle+'        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Services/SafariExtensionBridge.h"\n',1)
              p.write_text(s)
          t=root/'AppTests/ModelTests.swift'; ts=t.read_text()
          old='    func testSafariExtensionStatusCallbackIsExecutorSafe() async {'
          new='    @MainActor\n    func testSafariExtensionObjectiveCBridgeIsExecutorSafe() async {'
          if old not in ts: raise SystemExit('Safari regression test normalization point missing')
          t.write_text(ts.replace(old,new,1))
          if json.loads((root/'RELEASE-CANDIDATE-MANIFEST.json').read_text()).get('candidate') != 5: raise SystemExit('not RC5')
          roots=['App','AppTests','Models','NativeHost','SafariExtension','Services','Shared','Views']; files=[]
          for d in roots:
              for ext in ('*.swift','*.h','*.m'): files += list((root/d).rglob(ext))
          files += [root/'project.yml',root/'Info.plist',root/'SafariExtension/Info.plist']
          files=sorted(set(files),key=lambda f:f.relative_to(root).as_posix()); h=hashlib.sha256()
          for f in files:
              h.update(f.relative_to(root).as_posix().encode()); h.update(b'\0'); h.update(f.read_bytes()); h.update(b'\0')
          actual=h.hexdigest(); expected='77430e8ec3a954f2bf6b497532fc38094977ac7ff72679de04a3647712119a4c'
          print(f'RC5_FINAL_XCODE_INPUT_AGGREGATE={actual} FILES={len(files)}')
          if len(files)!=25 or actual!=expected: raise SystemExit('RC5 Objective-C bridge input closure differs from final local package')
          PY
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$work/Info.plist" | grep -Fx '30005'
          grep -F 'SWIFT_OBJC_BRIDGING_HEADER' "$work/project.yml"
          grep -F 'dispatch_get_main_queue' "$work/Services/SafariExtensionBridge.m"
          grep -F '@MainActor' "$work/Services/SafariExtensionService.swift"
          grep -F 'testSafariExtensionObjectiveCBridgeIsExecutorSafe' "$work/AppTests/ModelTests.swift"
          ! grep -F 'Dictionary(uniqueKeysWithValues:' "$work/Services/LocalStore.swift"
      - name: Validate changed macOS command scripts
        working-directory: ${{ runner.temp }}/gac-rc5
        shell: bash
        run: |
          set -euo pipefail
          for f in '清理旧版本.command' '构建并安装.command' '明日最终验收.command'; do echo "zsh -n: $f"; zsh -n "$f"; done
          grep -F '/usr/bin/find /Volumes' '清理旧版本.command'
          grep -F 'UserData/Downloads' '清理旧版本.command'
          grep -F 'DerivedData' '清理旧版本.command'
          grep -F 'lsregister' '清理旧版本.command'
      - name: Install XcodeGen
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version
      - name: Generate Xcode project
        working-directory: ${{ runner.temp }}/gac-rc5
        run: xcodegen generate --spec project.yml
      - name: XCTest with SafariServices XPC regression
        working-directory: ${{ runner.temp }}/gac-rc5
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/xcodebuild-tests.log"
          if ! xcodebuild -project GLaDOSAccountCenter.xcodeproj -scheme GLaDOSAccountCenter -configuration Debug -derivedDataPath "$RUNNER_TEMP/DerivedDataTests" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGNING_ALLOWED=YES test >"$log" 2>&1; then
            echo '--- XCTest failure ---'; tail -n 360 "$log"
            find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f -name 'GLaDOS Account Center*' -mmin -5 -print -exec tail -n 260 {} \; 2>/dev/null || true
            exit 1
          fi
          grep -E 'Executed [0-9]+ tests|TEST SUCCEEDED' "$log" | tail -n 30 || true
      - name: Release build exactly as installer
        working-directory: ${{ runner.temp }}/gac-rc5
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/xcodebuild-release.log"
          if ! xcodebuild -project GLaDOSAccountCenter.xcodeproj -scheme GLaDOSAccountCenter -configuration Release -derivedDataPath "$RUNNER_TEMP/DerivedDataRelease" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGNING_ALLOWED=YES build >"$log" 2>&1; then tail -n 360 "$log"; exit 1; fi
          app="$RUNNER_TEMP/DerivedDataRelease/Build/Products/Release/GLaDOS Account Center.app"
          test -d "$app/Contents/PlugIns/GLaDOS Account Center Safari Extension.appex"
          codesign --verify --deep --strict "$app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist" | grep -Fx 'com.enoch.glados-account-center'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist" | grep -Fx '30005'
          echo RC5_RELEASE_BUILD_OK
      - name: Release startup smoke for diagnosed SafariServices crash
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/DerivedDataRelease/Build/Products/Release/GLaDOS Account Center.app"
          exe="$app/Contents/MacOS/GLaDOS Account Center"
          smoke="$RUNNER_TEMP/rc5-startup-smoke.log"
          before="$RUNNER_TEMP/crashes-before.txt"; during="$RUNNER_TEMP/crashes-during.txt"
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f -name 'GLaDOS Account Center*' -print 2>/dev/null | sort > "$before" || true
          "$exe" >"$smoke" 2>&1 &
          pid=$!
          sleep 15
          if ! kill -0 "$pid" 2>/dev/null; then
            echo 'RC5 process exited during startup smoke.'; cat "$smoke" || true
            find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f -name 'GLaDOS Account Center*' -mmin -5 -print -exec tail -n 260 {} \; 2>/dev/null || true
            exit 1
          fi
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f -name 'GLaDOS Account Center*' -print 2>/dev/null | sort > "$during" || true
          new_reports=$(comm -13 "$before" "$during" || true)
          if [[ -n "$new_reports" ]]; then echo 'New GLaDOS crash report appeared:'; printf '%s\n' "$new_reports"; kill "$pid" 2>/dev/null || true; exit 1; fi
          /usr/bin/osascript -e 'tell application id "com.enoch.glados-account-center" to quit' >/dev/null 2>&1 || kill "$pid" 2>/dev/null || true
          for _ in 1 2 3 4 5; do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true
          echo RC5_STARTUP_SMOKE_OK
