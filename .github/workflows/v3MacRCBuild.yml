name: GLaDOS V3 macOS RC Build

on:
  workflow_dispatch:
  push:
    branches: [v3/account-center]
    paths:
      - '.github/glados/macos-rc4-ci.part*'
      - '.github/workflows/v3MacRCBuild.yml'
  pull_request:
    branches: [master]
    paths:
      - '.github/glados/macos-rc4-ci.part*'
      - '.github/workflows/v3MacRCBuild.yml'

permissions:
  contents: read

jobs:
  xcode-build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Restore RC4 source bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gac-rc4"
          cat .github/glados/macos-rc4-ci.part00 \
              .github/glados/macos-rc4-ci.part01 \
              .github/glados/macos-rc4-ci.part02 \
              .github/glados/macos-rc4-ci.part03 \
              .github/glados/macos-rc4-ci.part04 \
              .github/glados/macos-rc4-ci.part05 > "$RUNNER_TEMP/gac-rc4.b64"
          python3 - <<'PY'
          import base64, hashlib, os, pathlib
          src = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gac-rc4.b64'
          raw = base64.b64decode(src.read_text().strip(), validate=True)
          expected = 'c9961868e0c16f821f1bd465491d996af1d48d4ddf77fe648fa19d24cecb1e55'
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f'RC4 source bundle checksum mismatch: {actual}')
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'gac-rc4.tar.xz').write_bytes(raw)
          print('RC4_SOURCE_SHA256=' + actual)
          PY
          tar -xJf "$RUNNER_TEMP/gac-rc4.tar.xz" -C "$RUNNER_TEMP/gac-rc4"
          test -f "$RUNNER_TEMP/gac-rc4/project.yml"
          test -f "$RUNNER_TEMP/gac-rc4/Views/SecondaryViews.swift"
      - name: Apply RC4 project/test fixes
        working-directory: ${{ runner.temp }}/gac-rc4
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('project.yml')
          s=p.read_text()
          needle='''        PRODUCT_BUNDLE_IDENTIFIER: com.enoch.glados-account-center.tests\n        GENERATE_INFOPLIST_FILE: YES\n        CODE_SIGN_STYLE: Manual\n        CODE_SIGN_IDENTITY: "-"\n'''
          replacement='''        PRODUCT_BUNDLE_IDENTIFIER: com.enoch.glados-account-center.tests\n        GENERATE_INFOPLIST_FILE: YES\n        CODE_SIGN_STYLE: Manual\n        CODE_SIGN_IDENTITY: "-"\n        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GLaDOS Account Center.app/Contents/MacOS/GLaDOS Account Center"\n        BUNDLE_LOADER: "$(TEST_HOST)"\n'''
          if needle not in s:
              raise SystemExit('RC4 project.yml test target pattern not found')
          p.write_text(s.replace(needle,replacement))
          t=Path('AppTests/ModelTests.swift')
          ts=t.read_text()
          if '@testable import GLaDOSAccountCenter' not in ts:
              raise SystemExit('RC4 test import pattern not found')
          t.write_text(ts.replace('@testable import GLaDOSAccountCenter','@testable import GLaDOS_Account_Center'))
          PY
      - name: Install XcodeGen
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version
      - name: Generate Xcode project
        working-directory: ${{ runner.temp }}/gac-rc4
        run: xcodegen generate --spec project.yml
      - name: XCTest exactly as installer
        working-directory: ${{ runner.temp }}/gac-rc4
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/xcodebuild-tests.log"
          if ! xcodebuild \
            -project GLaDOSAccountCenter.xcodeproj \
            -scheme GLaDOSAccountCenter \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedDataTests" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGNING_ALLOWED=YES \
            test >"$log" 2>&1; then
            echo '--- XCTest failure (last 250 lines) ---'; tail -n 250 "$log"; exit 1
          fi
          tail -n 80 "$log"
      - name: Release build exactly as installer
        working-directory: ${{ runner.temp }}/gac-rc4
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/xcodebuild-release.log"
          if ! xcodebuild \
            -project GLaDOSAccountCenter.xcodeproj \
            -scheme GLaDOSAccountCenter \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedDataRelease" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGNING_ALLOWED=YES \
            build >"$log" 2>&1; then
            echo '--- Release failure (last 250 lines) ---'; tail -n 250 "$log"; exit 1
          fi
          app="$RUNNER_TEMP/DerivedDataRelease/Build/Products/Release/GLaDOS Account Center.app"
          test -d "$app"
          test -d "$app/Contents/PlugIns/GLaDOS Account Center Safari Extension.appex"
          codesign --verify --deep --strict "$app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist" | grep -Fx 'com.enoch.glados-account-center'
          tail -n 60 "$log"
