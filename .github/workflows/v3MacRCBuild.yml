name: GLaDOS V3 macOS RC Build

on:
  workflow_dispatch:
  push:
    branches: [v3/account-center]
    paths:
      - '.github/glados/macos-rc4-ci.tar.gz.b64'
      - '.github/workflows/v3MacRCBuild.yml'

permissions:
  contents: read

jobs:
  xcode-build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Restore RC4 source bundle
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gac-rc4"
          python3 - <<'PY'
          import base64, pathlib
          src=pathlib.Path('.github/glados/macos-rc4-ci.tar.gz.b64').read_text().strip()
          pathlib.Path('/tmp/gac-rc4.tar.gz').write_bytes(base64.b64decode(src))
          PY
          tar -xzf /tmp/gac-rc4.tar.gz -C "$RUNNER_TEMP/gac-rc4"
      - name: Install XcodeGen
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version
      - name: Generate Xcode project
        working-directory: ${{ runner.temp }}/gac-rc4
        run: xcodegen generate --spec project.yml
      - name: Release build
        working-directory: ${{ runner.temp }}/gac-rc4
        run: |
          set -o pipefail
          xcodebuild \
            -project GLaDOSAccountCenter.xcodeproj \
            -scheme GLaDOSAccountCenter \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee "$RUNNER_TEMP/xcodebuild-release.log"
      - name: Build tests
        working-directory: ${{ runner.temp }}/gac-rc4
        run: |
          set -o pipefail
          xcodebuild \
            -project GLaDOSAccountCenter.xcodeproj \
            -scheme GLaDOSAccountCenter \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedDataTests" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build-for-testing | tee "$RUNNER_TEMP/xcodebuild-tests.log"
