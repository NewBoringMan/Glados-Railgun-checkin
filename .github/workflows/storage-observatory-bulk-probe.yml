name: Storage Observatory Bulk Scanner Probe
on:
  push:
    branches: [storage-observatory-ci-temp]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bulk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify and materialize exact source
        shell: bash
        run: |
          set -euo pipefail
          cat storage-observatory-bulk-probe-v3/chunk-*.b64 > /tmp/probe.b64
          echo "1b768dc5b0cd9729db4813304f5348cea145ec783fe4e1fae2d511a5fabef53f  /tmp/probe.b64" | shasum -a 256 -c -
          base64 -D -i /tmp/probe.b64 -o /tmp/probe.tar.gz
          echo "4d98071b0e34a1b706fd49ecf1f41601fc379d95b7df90bdf733e3a037c7b478  /tmp/probe.tar.gz" | shasum -a 256 -c -
          mkdir probe
          tar -xzf /tmp/probe.tar.gz -C probe
      - name: Toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
      - name: Compile and run bulk scanner probe
        working-directory: probe
        run: swift test --parallel
