name: Storage Observatory Bulk Scanner Probe
on:
  push:
    branches: [storage-observatory-ci-temp]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bulk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify and materialize exact source
        shell: bash
        run: |
          set -euo pipefail
          cat storage-observatory-bulk-probe-v3/chunk-*.b64 > /tmp/probe.b64
          echo "1b768dc5b0cd9729db4813304f5348cea145ec783fe4e1fae2d511a5fabef53f  /tmp/probe.b64" | shasum -a 256 -c -
          base64 -D -i /tmp/probe.b64 -o /tmp/probe.tar.gz
          echo "4d98071b0e34a1b706fd49ecf1f41601fc379d95b7df90bdf733e3a037c7b478  /tmp/probe.tar.gz" | shasum -a 256 -c -
          mkdir probe
          tar -xzf /tmp/probe.tar.gz -C probe
          cat > probe/Tests/BulkProbeTests/BulkProbeTests.swift <<'SWIFT'
          import XCTest
          import Foundation
          @testable import StorageScanner
          @testable import StorageCore

          final class BulkProbeTests: XCTestCase {
              private let volume = VolumeIdentity(uuid: UUID(), fileSystem: "apfs-test")

              func testBulkMatchesFoundationAndDeduplicatesHardlinks() throws {
                  let fm = FileManager.default
                  let root = fm.temporaryDirectory.appendingPathComponent("StorageObservatoryBulkProbe-\(UUID().uuidString)")
                  defer { try? fm.removeItem(at: root) }
                  try fm.createDirectory(at: root.appendingPathComponent("nested"), withIntermediateDirectories: true)
                  let a = root.appendingPathComponent("nested/a.bin")
                  let b = root.appendingPathComponent("b.txt")
                  let hard = root.appendingPathComponent("a-hard.bin")
                  try Data(repeating: 0x41, count: 8192).write(to: a)
                  try Data("hello".utf8).write(to: b)
                  try fm.linkItem(at: a, to: hard)

                  let foundation = MetadataScanner().scan(root: root, volume: volume)
                  let bulk = try XCTUnwrap(BulkMetadataScanner().scan(root: root, volume: volume))
                  XCTAssertEqual(bulk.backend, ScanBackend.bulk)
                  XCTAssertTrue(bulk.failures.isEmpty, "bulk failures: \(bulk.failures)")

                  let aPath = PathCanonicalizer.nodePath(a)
                  let hardPath = PathCanonicalizer.nodePath(hard)
                  let foundationNonHard = Set(foundation.nodes.values.map { $0.path }.filter { $0 != aPath && $0 != hardPath })
                  let bulkNonHard = Set(bulk.nodes.values.map { $0.path }.filter { $0 != aPath && $0 != hardPath })
                  XCTAssertEqual(bulkNonHard, foundationNonHard)
                  XCTAssertNotNil(bulk.nodes.values.first { $0.path == PathCanonicalizer.nodePath(b) })

                  let bulkA = bulk.nodes.values.filter { $0.path == aPath || $0.path == hardPath }
                  XCTAssertEqual(bulkA.count, 1, "hard-linked content should be represented once")
                  XCTAssertEqual(bulkA.first?.size.logicalBytes, 8192)
              }

              func testAdaptiveSelectsBulkOnMacOS() throws {
                  let fm = FileManager.default
                  let root = fm.temporaryDirectory.appendingPathComponent("StorageObservatoryAdaptiveProbe-\(UUID().uuidString)")
                  defer { try? fm.removeItem(at: root) }
                  try fm.createDirectory(at: root, withIntermediateDirectories: true)
                  try Data("x".utf8).write(to: root.appendingPathComponent("x.txt"))
                  let result = AdaptiveMetadataScanner().scan(root: root, volume: volume)
                  XCTAssertEqual(result.backend, ScanBackend.bulk)
                  XCTAssertTrue(result.nodes.values.contains { $0.path.hasSuffix("x.txt") })
              }
          }
          SWIFT
      - name: Toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
      - name: Compile and run bulk scanner probe
        working-directory: probe
        run: swift test --parallel
