name: GLaDOS V3 One-Time Keychain Recovery

on:
  workflow_dispatch:
    inputs:
      public_key_b64:
        description: Ephemeral RSA public key in base64
        required: true
        type: string

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Encrypt managed account secrets for local Keychain recovery
        env:
          C_059502CEBB0D18D6: ${{ secrets.GLADOS_ACCOUNT_059502CEBB0D18D6 }}
          C_28993337790302AC: ${{ secrets.GLADOS_ACCOUNT_28993337790302AC }}
          C_69B9338D952FEE8D: ${{ secrets.GLADOS_ACCOUNT_69B9338D952FEE8D }}
          C_6BA27F0D29BB2856: ${{ secrets.GLADOS_ACCOUNT_6BA27F0D29BB2856 }}
          C_754D6E4FA3AC25D9: ${{ secrets.GLADOS_ACCOUNT_754D6E4FA3AC25D9 }}
          PUBKEY_B64: ${{ inputs.public_key_b64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$PUBKEY_B64" | base64 --decode > pub.pem
          openssl pkey -pubin -in pub.pem -noout
          python3 - <<'PY'
          import base64, json, os, subprocess
          keys = ['059502CEBB0D18D6', '28993337790302AC', '69B9338D952FEE8D', '6BA27F0D29BB2856', '754D6E4FA3AC25D9']
          for key in keys:
              secret = os.environ.get("C_" + key, "")
              if not secret:
                  raise SystemExit("managed secret missing for " + key)
              raw = secret.encode("utf-8")
              chunks = [raw[i:i+300] for i in range(0, len(raw), 300)]
              encrypted = []
              for chunk in chunks:
                  p = subprocess.run(
                      [
                          "openssl", "pkeyutl", "-encrypt",
                          "-pubin", "-inkey", "pub.pem",
                          "-pkeyopt", "rsa_padding_mode:oaep",
                          "-pkeyopt", "rsa_oaep_md:sha256",
                          "-pkeyopt", "rsa_mgf1_md:sha256",
                      ],
                      input=chunk,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      check=True,
                  )
                  encrypted.append(base64.b64encode(p.stdout).decode("ascii"))
              payload = base64.b64encode(json.dumps(encrypted, separators=(",", ":")).encode()).decode("ascii")
              print("GAC_RECOVERY_" + key + "=" + payload)
          PY
          rm -f pub.pem
