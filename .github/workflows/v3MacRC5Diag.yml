name: GLaDOS V3 RC5 XCTest Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Diagnostic note
        run: |
          echo 'RC5 SafariServices crash root cause was captured and fixed by the Objective-C XPC reply bridge.'
          echo 'This workflow is retained as a manual-only diagnostic utility and is no longer a PR gate.'
