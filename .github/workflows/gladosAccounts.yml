# Managed by GLaDOS Account Center V2.
# Account cookies remain in independent GitHub Actions secrets.
name: GLaDOS Multi-Account Check-in

on:
  workflow_dispatch:
    inputs:
      account:
        description: Account key to run, or all
        required: false
        default: all
        type: string
  schedule:
    - cron: '0 5,17 * * *'
      timezone: 'Asia/Taipei'

permissions:
  contents: read

concurrency:
  group: glados-multi-account-${{ github.ref }}
  cancel-in-progress: false

jobs:
  account_059502cebb0d18d6:
    name: GLaDOS account 059502CEBB0D18D6
    if: ${{ github.event_name == 'schedule' || inputs.account == 'all' || inputs.account == '059502CEBB0D18D6' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run check-in
        env:
          GLADOS_COOKIES: ${{ secrets.GLADOS_ACCOUNT_059502CEBB0D18D6 }}
          GLADOS_ACCOUNT_KEY: '059502CEBB0D18D6'
          GLADOS_AUTO_EXCHANGE: 'false'
          GLADOS_EXCHANGE_CATALOG: '.github/glados/exchange_plans.json'
          PUSHDEER_SENDKEY: ${{ secrets.PUSHDEER_SENDKEY }}
          GLADOS_VERBOSE: 'true'
        run: python checkin.py

