# This file is managed by GLaDOS Check-in Assistant.
# Each account uses an independent GitHub Actions secret. Existing accounts are never merged or overwritten.
name: GLaDOS Multi-Account Check-in

on:
  workflow_dispatch:
    inputs:
      account:
        description: Account key to run, or all
        required: false
        default: all
        type: string
  schedule:
    - cron: '0 4,10 * * *'

permissions:
  contents: read

concurrency:
  group: glados-multi-account-${{ github.ref }}
  cancel-in-progress: false

jobs:
  account_28993337790302ac:
    name: GLaDOS account 28993337790302AC
    if: ${{ github.event_name == 'schedule' || inputs.account == 'all' || inputs.account == '28993337790302AC' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pypushdeer

      - name: Run and verify check-in
        shell: bash
        env:
          GLADOS_COOKIES: ${{ secrets.GLADOS_ACCOUNT_28993337790302AC }}
          GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN }}
          PUSHDEER_SENDKEY: ${{ secrets.PUSHDEER_SENDKEY }}
          GLADOS_VERBOSE: 'true'
        run: |
          set -o pipefail
          python checkin.py 2>&1 | tee checkin.log
          if ! grep -Eq '签到成功|重复签到' checkin.log; then
            echo "::error::No successful or repeated check-in evidence was found."
            exit 1
          fi
