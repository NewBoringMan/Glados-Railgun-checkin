name: Storage Observatory Public macOS Probe
on:
  push:
    branches: [storage-observatory-ci-temp]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
