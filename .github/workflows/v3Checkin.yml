name: GLaDOS V3 Check-in

on:
  workflow_dispatch:
    inputs:
      lock:
        description: Privacy-safe account lock id to run, or all
        required: false
        default: all
        type: string
      run_mode:
        description: primary, recovery, or read_only
        required: false
        default: primary
        type: choice
        options: [primary, recovery, read_only]
  schedule:
    - cron: '7 5 * * *'
      timezone: 'Asia/Taipei'
    - cron: '7 17 * * *'
      timezone: 'Asia/Taipei'

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: glados-v3-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.lock || 'scheduled' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      run_mode: ${{ steps.mode.outputs.run_mode }}
      has_accounts: ${{ steps.matrix.outputs.has_accounts }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.run_mode }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then mode="${INPUT_MODE:-primary}"
          elif [[ "$SCHEDULE" == "7 17 * * *" ]]; then mode="recovery"
          else mode="primary"; fi
          echo "run_mode=$mode" >> "$GITHUB_OUTPUT"
      - id: matrix
        shell: bash
        env:
          LOCK_FILTER: ${{ inputs.lock }}
        run: |
          lock="${LOCK_FILTER:-all}"
          matrix="$(python3 scripts/v3_matrix.py --lock "$lock")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          count="$(python3 -c 'import json,sys; print(len(json.load(sys.stdin).get("include", [])))' <<< "$matrix")"
          [[ "$count" -gt 0 ]] && echo "has_accounts=true" >> "$GITHUB_OUTPUT" || echo "has_accounts=false" >> "$GITHUB_OUTPUT"

  checkin:
    needs: prepare
    name: GLaDOS ${{ needs.prepare.outputs.run_mode }} slot ${{ matrix.slot }} · ${{ matrix.lock_id }}
    if: ${{ needs.prepare.outputs.has_accounts == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - run: pip install -r requirements-v3.txt
      - name: Skip when primary slot already succeeded
        id: recovery_gate
        if: ${{ needs.prepare.outputs.run_mode == 'recovery' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          SLOT: ${{ matrix.slot }}
        run: |
          skip="$(python3 scripts/v3_recovery_gate.py --repo "$GH_REPO" --current-run "$CURRENT_RUN_ID" --slot "$SLOT")"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
      - name: Check durable exchange safety lock
        id: exchange_lock
        if: ${{ matrix.auto_exchange == true }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LOCK_ID: ${{ matrix.lock_id }}
        run: |
          count="$(gh issue list --repo "$GH_REPO" --state open --search "GLaDOS exchange lock $LOCK_ID in:title" --json number --jq 'length' 2>/dev/null || echo 0)"
          [[ "$count" -gt 0 ]] && echo "locked=true" >> "$GITHUB_OUTPUT" || echo "locked=false" >> "$GITHUB_OUTPUT"
      - name: Run account task
        id: account_task
        if: ${{ steps.recovery_gate.outputs.skip != 'true' }}
        shell: bash
        env:
          GLADOS_COOKIES: ${{ secrets[matrix.secret_name] }}
          GLADOS_SLOT: ${{ matrix.slot }}
          GLADOS_AUTO_EXCHANGE: ${{ matrix.auto_exchange == true && steps.exchange_lock.outputs.locked != 'true' }}
          GLADOS_RUN_MODE: ${{ needs.prepare.outputs.run_mode }}
          GLADOS_EXCHANGE_CATALOG: .github/glados/exchange_plans.json
          PUSHDEER_SENDKEY: ${{ secrets.PUSHDEER_SENDKEY }}
        run: |
          set +e
          python v3_runtime.py 2>&1 | tee v3-runtime.log
          status=${PIPESTATUS[0]}
          if grep -Fq '"exchange":"verification-failed"' v3-runtime.log; then echo "freeze=true" >> "$GITHUB_OUTPUT"; else echo "freeze=false" >> "$GITHUB_OUTPUT"; fi
          exit "$status"
      - name: Freeze automatic exchange after ambiguous verification
        if: ${{ always() && steps.account_task.outputs.freeze == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LOCK_ID: ${{ matrix.lock_id }}
          SLOT: ${{ matrix.slot }}
        run: |
          existing="$(gh issue list --repo "$GH_REPO" --state open --search "GLaDOS exchange lock $LOCK_ID in:title" --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          if [[ -z "$existing" ]]; then
            gh issue create --repo "$GH_REPO" --title "GLaDOS exchange lock $LOCK_ID" --body "Account Center V3 automatically froze automatic exchange for slot $SLOT because an exchange POST could not be confirmed by both points decrease and membership-days increase. Check the account in Account Center, refresh its GLaDOS state, then explicitly clear the lock before re-enabling automatic exchange. No Cookie, email, balance, or persistent account key is stored in this issue."
          fi
