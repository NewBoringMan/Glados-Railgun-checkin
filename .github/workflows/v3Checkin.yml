name: GLaDOS V3 Check-in

on:
  workflow_dispatch:
    inputs:
      account:
        description: Account key to run, or all
        required: false
        default: all
        type: string
      run_mode:
        description: primary, recovery, or read_only
        required: false
        default: primary
        type: choice
        options: [primary, recovery, read_only]
  schedule:
    - cron: '7 5 * * *'
      timezone: 'Asia/Taipei'
    - cron: '7 17 * * *'
      timezone: 'Asia/Taipei'

permissions:
  contents: read
  actions: read

concurrency:
  group: glados-v3-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.account || 'scheduled' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      run_mode: ${{ steps.mode.outputs.run_mode }}
      has_accounts: ${{ steps.matrix.outputs.has_accounts }}
    steps:
      - uses: actions/checkout@v6
      - id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.run_mode }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="${INPUT_MODE:-primary}"
          elif [[ "$SCHEDULE" == "7 17 * * *" ]]; then
            mode="recovery"
          else
            mode="primary"
          fi
          echo "run_mode=$mode" >> "$GITHUB_OUTPUT"
      - id: matrix
        shell: bash
        env:
          ACCOUNT_FILTER: ${{ inputs.account }}
        run: |
          account="${ACCOUNT_FILTER:-all}"
          matrix="$(python3 scripts/v3_matrix.py --account "$account")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          count="$(python3 -c 'import json,sys; print(len(json.load(sys.stdin).get("include", [])))' <<< "$matrix")"
          if [[ "$count" -gt 0 ]]; then echo "has_accounts=true" >> "$GITHUB_OUTPUT"; else echo "has_accounts=false" >> "$GITHUB_OUTPUT"; fi

  checkin:
    needs: prepare
    name: GLaDOS check-in slot ${{ matrix.slot }}
    if: ${{ needs.prepare.outputs.has_accounts == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r requirements-v3.txt
      - name: Skip when primary slot already succeeded
        id: recovery_gate
        if: ${{ needs.prepare.outputs.run_mode == 'recovery' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          SLOT: ${{ matrix.slot }}
        run: |
          skip="$(python3 - <<'PY'
          import json, os, subprocess
          from datetime import datetime
          from zoneinfo import ZoneInfo

          repo = os.environ['GH_REPO']
          current = int(os.environ['CURRENT_RUN_ID'])
          slot = os.environ['SLOT']
          today = datetime.now(ZoneInfo('Asia/Taipei')).date()
          try:
              rows = json.loads(subprocess.check_output([
                  'gh','run','list','--repo',repo,'--workflow','v3Checkin.yml','--event','schedule','--limit','12',
                  '--json','databaseId,createdAt,status'
              ], text=True))
          except Exception:
              print('false'); raise SystemExit
          run_id = None
          for row in rows:
              if int(row.get('databaseId', 0)) == current or row.get('status') != 'completed':
                  continue
              try:
                  created = datetime.fromisoformat(row['createdAt'].replace('Z','+00:00')).astimezone(ZoneInfo('Asia/Taipei'))
              except Exception:
                  continue
              if created.date() == today and created.hour < 12:
                  run_id = str(row['databaseId']); break
          if not run_id:
              print('false'); raise SystemExit
          try:
              view = json.loads(subprocess.check_output(['gh','run','view',run_id,'--repo',repo,'--json','jobs'], text=True))
          except Exception:
              print('false'); raise SystemExit
          target = f'GLaDOS check-in slot {slot}'
          ok = any(job.get('name') == target and job.get('conclusion') == 'success' for job in view.get('jobs', []))
          print('true' if ok else 'false')
          PY
          )"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [[ "$skip" == "true" ]]; then echo "Morning slot already succeeded; recovery POST is skipped."; fi
      - name: Check in account
        if: ${{ steps.recovery_gate.outputs.skip != 'true' }}
        env:
          GLADOS_COOKIES: ${{ secrets[matrix.secret_name] }}
          GLADOS_ACCOUNT_KEY: ${{ matrix.account_key }}
          GLADOS_AUTO_EXCHANGE: ${{ matrix.auto_exchange }}
          GLADOS_RUN_MODE: ${{ needs.prepare.outputs.run_mode }}
          GLADOS_EXCHANGE_CATALOG: .github/glados/exchange_plans.json
        run: python v3_runtime.py
