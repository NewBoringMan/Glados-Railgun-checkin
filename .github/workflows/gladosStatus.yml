name: GLaDOS Account Status

on:
  workflow_dispatch:
    inputs:
      account:
        description: Account key to refresh, or all
        required: false
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: glados-status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  account_059502cebb0d18d6:
    name: GLaDOS status 059502CEBB0D18D6
    if: ${{ inputs.account == 'all' || inputs.account == '059502CEBB0D18D6' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Read account status
        env:
          GLADOS_COOKIES: ${{ secrets.GLADOS_ACCOUNT_059502CEBB0D18D6 }}
          GLADOS_ACCOUNT_KEY: '059502CEBB0D18D6'
        run: python status.py

