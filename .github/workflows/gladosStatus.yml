name: GLaDOS Account Status

on:
  workflow_dispatch:
    inputs:
      account:
        description: Account key to refresh, or all
        required: false
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: glados-status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  account_009ca646e3b6e8e8:
    name: GLaDOS status 009CA646E3B6E8E8
    if: ${{ inputs.account == 'all' || inputs.account == '009CA646E3B6E8E8' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Read account status
        env:
          GLADOS_COOKIES: ${{ secrets.GLADOS_ACCOUNT_009CA646E3B6E8E8 }}
          GLADOS_ACCOUNT_KEY: '009CA646E3B6E8E8'
        run: python status.py

