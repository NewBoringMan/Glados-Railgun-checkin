name: GLaDOS V3 Tests
on:
  workflow_dispatch:
  push:
    branches: [v3/account-center]
    paths: ['v3_runtime.py','requirements-v3.txt','scripts/**','tests/test_v3_*.py','.github/glados/**','.github/workflows/v3*.yml']
  pull_request:
    paths: ['v3_runtime.py','requirements-v3.txt','scripts/**','tests/test_v3_*.py','.github/glados/**','.github/workflows/v3*.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Verify complete dependency pins
        shell: bash
        run: |
          bad="$(grep -vE '^[A-Za-z0-9_.-]+==[A-Za-z0-9_.+-]+$|^$' requirements-v3.txt || true)"
          [[ -z "$bad" ]] || { echo "Unpinned requirement:"; echo "$bad"; exit 1; }
      - run: pip install -r requirements-v3.txt
      - run: python -m py_compile v3_runtime.py scripts/v3_matrix.py scripts/v3_recovery_gate.py
      - run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_v3_*.py' -v
      - name: Secret / PII leak scan
        shell: bash
        run: |
          targets=(v3_runtime.py scripts .github/glados .github/workflows/v3Checkin.yml .github/workflows/v3Canary.yml .github/workflows/v3Heartbeat.yml)
          ! grep -RIE --exclude='*.md' 'koa:sess=|gh[oprsu]_[A-Za-z0-9_]{20,}' "${targets[@]}"
          ! grep -nE 'print\(.*(cookie|email|points_payload|status_payload)' v3_runtime.py
          ! grep -RIE 'GLADOS_ACCOUNT_KEY' v3_runtime.py scripts .github/workflows/v3Checkin.yml .github/workflows/v3Canary.yml .github/workflows/v3Heartbeat.yml
      - name: Verify GitHub Actions are SHA pinned
        shell: bash
        run: |
          bad="$(grep -RIE 'uses: (actions/checkout|actions/setup-python)@v[0-9]' .github/workflows/v3*.yml || true)"
          [[ -z "$bad" ]] || { echo "$bad"; exit 1; }
