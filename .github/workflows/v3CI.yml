name: GLaDOS V3 Tests

on:
  workflow_dispatch:
  push:
    branches: [v3/account-center]
    paths:
      - 'v3_runtime.py'
      - 'requirements-v3.txt'
      - 'scripts/v3_matrix.py'
      - 'tests/test_v3_*.py'
      - '.github/glados/**'
      - '.github/workflows/v3*.yml'
  pull_request:
    paths:
      - 'v3_runtime.py'
      - 'requirements-v3.txt'
      - 'scripts/v3_matrix.py'
      - 'tests/test_v3_*.py'
      - '.github/glados/**'
      - '.github/workflows/v3*.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r requirements-v3.txt
      - run: python -m py_compile v3_runtime.py scripts/v3_matrix.py
      - run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_v3_*.py' -v
