name: GLaDOS Check-in Tests

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'checkin.py'
      - 'logging_config.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/glados/**'
  pull_request:
    paths:
      - 'checkin.py'
      - 'logging_config.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/glados/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
