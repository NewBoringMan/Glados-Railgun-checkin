name: GLaDOS Check-in Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 1 * *'
      timezone: 'Asia/Taipei'
  push:
    branches: [ master ]
    paths:
      - 'checkin.py'
      - 'status.py'
      - 'logging_config.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/glados/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'checkin.py'
      - 'status.py'
      - 'logging_config.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/glados/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  test:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m py_compile checkin.py status.py logging_config.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  keepalive:
    name: Monthly repository keepalive
    if: ${{ github.event_name == 'schedule' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Record repository activity
        shell: bash
        run: |
          set -euo pipefail
          date -u '+%Y-%m-%dT%H:%M:%SZ' > .github/keepalive
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/keepalive
          if git diff --cached --quiet; then
            echo 'No keepalive change required.'
            exit 0
          fi
          git commit -m 'chore: monthly repository keepalive'
          git push

  cleanup-failed-maintenance-runs-once:
    name: Remove failed maintenance runs
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Temporary remove failed maintenance runs' }}
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Delete failed transient runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 31623808056 31623923099; do
            if gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >/dev/null 2>&1; then
              echo "Deleted transient run ${run_id}"
            else
              echo "Transient run ${run_id} was already absent"
            fi
          done
