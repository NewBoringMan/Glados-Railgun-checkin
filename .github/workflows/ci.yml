name: GLaDOS Check-in Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 1 * *'
      timezone: 'Asia/Taipei'
  push:
    branches: [ master ]
    paths:
      - 'checkin.py'
      - 'status.py'
      - 'logging_config.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/glados/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'checkin.py'
      - 'status.py'
      - 'logging_config.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/glados/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  test:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m py_compile checkin.py status.py logging_config.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  keepalive:
    name: Monthly repository keepalive
    if: ${{ github.event_name == 'schedule' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Record repository activity
        shell: bash
        run: |
          set -euo pipefail
          date -u '+%Y-%m-%dT%H:%M:%SZ' > .github/keepalive
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/keepalive
          if git diff --cached --quiet; then
            echo 'No keepalive change required.'
            exit 0
          fi
          git commit -m 'chore: monthly repository keepalive'
          git push

  withdraw_account_center_source:
    name: Finalize Account Center public withdrawal
    if: ${{ github.event_name == 'push' }}
    permissions:
      actions: write
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify public source refs are absent
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          refs=(
            'heads/v3/account-center'
            'tags/archive-v3-account-center-20260812'
          )
          for ref in "${refs[@]}"; do
            if gh api "repos/${repo}/git/ref/${ref}" >/dev/null 2>&1; then
              echo "Unexpected public ref still exists: refs/${ref}" >&2
              exit 1
            fi
          done
      - name: Remove transient maintenance runs
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          for run_id in 31626283645 31626335243; do
            if gh api "repos/${repo}/actions/runs/${run_id}" >/dev/null 2>&1; then
              gh api --method DELETE "repos/${repo}/actions/runs/${run_id}"
            fi
          done
