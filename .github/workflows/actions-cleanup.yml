name: GitHub Actions Storage Cleanup

# Only maintenance logic. Do not modify business workflows.
# This workflow cleans historical Actions data only.

on:
  workflow_dispatch:
  schedule:
    # Daily cleanup at 04:17 Taipei time
    - cron: '17 4 * * *'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Cleanup old Actions history and artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"

          echo "Cleaning workflow runs for ${repo}"

          # Keep recent execution history for troubleshooting.
          # Remove runs older than 3 days.
          gh api --paginate "repos/${repo}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.created_at < (now - 259200 | todate)) | .id' \
            | while read -r run_id; do
                if [ -n "${run_id}" ]; then
                  echo "Deleting workflow run ${run_id}"
                  gh api --method DELETE "repos/${repo}/actions/runs/${run_id}" || true
                fi
              done

      - name: Cleanup old Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"

          echo "Cleaning artifacts for ${repo}"

          # Remove artifacts older than 3 days.
          gh api --paginate "repos/${repo}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.created_at < (now - 259200 | todate)) | .id' \
            | while read -r artifact_id; do
                if [ -n "${artifact_id}" ]; then
                  echo "Deleting artifact ${artifact_id}"
                  gh api --method DELETE "repos/${repo}/actions/artifacts/${artifact_id}" || true
                fi
              done

          echo "Cleanup completed"
