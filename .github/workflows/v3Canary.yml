name: GLaDOS V3 Read-only Canary
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'v3_runtime.py'
      - 'scripts/v3_matrix.py'
      - '.github/glados/accounts.v3.json'
      - '.github/glados/exchange_plans.json'
      - '.github/workflows/v3Canary.yml'
permissions:
  contents: read
jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - id: matrix
        run: echo "matrix=$(python3 scripts/v3_matrix.py --account all)" >> "$GITHUB_OUTPUT"
  canary:
    needs: prepare
    name: Read-only canary slot ${{ matrix.slot }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - run: pip install -r requirements-v3.txt
      - name: GET-only account check
        env:
          GLADOS_COOKIES: ${{ secrets[matrix.secret_name] }}
          GLADOS_ACCOUNT_KEY: ${{ matrix.account_key }}
          GLADOS_AUTO_EXCHANGE: 'false'
          GLADOS_RUN_MODE: read_only
          GLADOS_EXCHANGE_CATALOG: .github/glados/exchange_plans.json
        run: python v3_runtime.py
