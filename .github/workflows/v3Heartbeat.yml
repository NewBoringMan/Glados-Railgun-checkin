name: GLaDOS V3 Scheduler Heartbeat
on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 1 * *'
      timezone: 'Asia/Taipei'
permissions:
  contents: write
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Refresh repository activity marker
        shell: bash
        run: |
          marker=.github/glados/heartbeat.txt
          printf '%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > "$marker"
          if git diff --quiet -- "$marker"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$marker"
          git commit -m 'chore: refresh GLaDOS scheduler heartbeat'
          git push
